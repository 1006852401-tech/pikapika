name: Build Pikachu Audio Plugin (macOS AU & VST3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build Universal 2 (Apple Silicon + Intel) AU & VST3
    runs-on: macos-14
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 构建前端 1:1 静态网页 (dist)
        run: |
          npm install --legacy-peer-deps
          npm run build
          ls -la dist/

      - name: 4. 准备 C++ 工程与 JUCE 框架
        run: |
          if [ ! -d "JUCE" ]; then
            git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git
          fi

      - name: 5. CMake 配置 (Universal 2: ARM64 + x86_64)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      - name: 6. 编译 AU 和 VST3 原生插件
        run: |
          cmake --build build --config Release --parallel 4

      - name: 7. 将前端网页注入插件包并打包
        run: |
          mkdir -p release-pkg/AU release-pkg/VST3
          
          # 自动寻找编译出来的 .component 和 .vst3
          find build -name "*.component" -exec cp -R {} release-pkg/AU/ \;
          find build -name "*.vst3" -exec cp -R {} release-pkg/VST3/ \;
          
          # 注入 dist 静态网页资源到 Resources
          find release-pkg -name "*.component" -o -name "*.vst3" | while read -r plugin; do
            mkdir -p "$plugin/Contents/Resources/dist"
            cp -R dist/* "$plugin/Contents/Resources/dist/"
          done
          
          cd release-pkg
          zip -r ../PikachuAudioMeter-macOS-Universal.zip AU/ VST3/
          cd ..
          ls -lh PikachuAudioMeter-macOS-Universal.zip

      - name: 8. 上传发布成品安装包
        uses: actions/upload-artifact@v4
        with:
          name: PikachuAudioMeter-macOS-AU-VST3
          path: PikachuAudioMeter-macOS-Universal.zip
